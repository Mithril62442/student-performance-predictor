
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentLy.</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #dbbcf0;
            color: #1a174e;
            overflow-x: hidden;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 76px;
            background: #510c50;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 58px;

            position: relative;
            z-index: 10;
        }


        .logo {
            font-family: Arial, sans-serif;
            font-size: 40px;
            font-weight: 700;
            color: #b4d8e4;

            letter-spacing: -1.5px;
        }


        .nav-links {
            display: flex;
            align-items: center;
            gap: 260px;

            margin-left: 80px;
        }


        .nav-links a {
            text-decoration: none;
            color: white;

            font-family: Arial, sans-serif;
            font-size: 31px;
            font-weight: 700;
        }


        .login-button {
            width: 212px;
            height: 45px;

            border-radius: 30px;
            border: none;

            background: #b4d8e4;
            color: #24151c;

            font-family: Arial, sans-serif;
            font-size: 28px;
            font-weight: 700;

            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }


        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 76px);

            position: relative;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            text-align: center;

            padding-top: 174px;

            overflow: hidden;
        }


        .hero-content {
            position: relative;
            z-index: 5;

            width: 100%;
            max-width: 1200px;

            padding: 0 20px;
        }


        .hero-title {
            font-family: "Rye", Georgia, serif;

            font-size: 52px;
            line-height: 1.15;

            color: #24126d;

            margin-bottom: 78px;

            white-space: nowrap;
        }


        .hero-description {
            font-family: "Rye", Georgia, serif;

            font-size: 34px;
            line-height: 1.75;

            color: #10124d;

            max-width: 900px;

            margin: 0 auto 145px;
        }


        /* =========================
           GET STARTED BUTTON
        ========================= */

        .start-button {
            width: 516px;
            height: 153px;

            margin: 0 auto;

            background: #1a174e;
            color: #f3e9f8;

            border-radius: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            font-family: "Space Grotesk", Arial, sans-serif;
            font-size: 41px;
            font-weight: 700;

            box-shadow:
                8px 10px 12px rgba(0, 0, 0, 0.30);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .start-button:hover {
            transform: translateY(-4px);

            box-shadow:
                10px 14px 15px rgba(0, 0, 0, 0.35);
        }


        /* =========================
           DECORATIVE STARS
        ========================= */

        .star {
            position: absolute;

            color: #f5c400;

            font-family: Arial, sans-serif;

            font-size: 45px;

            line-height: 1;

            z-index: 2;
        }


        .star.small {
            font-size: 30px;
        }


        .star.s1 {
            top: 70px;
            left: 285px;
        }


        .star.s2 {
            top: 18px;
            left: 750px;

            font-size: 75px;
        }


        .star.s3 {
            top: 355px;
            right: 160px;
        }


        .star.s4 {
            top: 415px;
            left: 65px;

            font-size: 32px;
        }


        .star.s5 {
            bottom: 270px;
            left: 215px;
        }


        .star.s6 {
            bottom: 40px;
            left: 600px;

            font-size: 34px;
        }


        .star.s7 {
            bottom: 265px;
            right: 245px;
        }


        .star.s8 {
            bottom: 45px;
            right: 145px;

            font-size: 31px;
        }


        /* =========================
           TARGETS
        ========================= */

        .target {
            position: absolute;

            width: 112px;
            height: 112px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #e58db7 0 12%,
                    transparent 13% 28%,
                    #e58db7 29% 42%,
                    transparent 43% 58%,
                    #e58db7 59% 100%
                );

            opacity: 0.9;

            z-index: 1;
        }


        .target::after {
            content: "";

            position: absolute;

            width: 72px;
            height: 4px;

            background: #e58db7;

            transform: rotate(-42deg);

            top: 52px;
            left: 22px;

            transform-origin: center;
        }


        .target.t1 {
            top: 292px;
            left: 125px;
        }


        .target.t2 {
            top: 100px;
            right: -20px;
        }


        .target.t3 {
            bottom: 60px;
            left: 72px;
        }


        .target.t4 {
            bottom: -15px;
            right: 185px;
        }


        /* =========================
           ACADEMIC DECORATIONS
        ========================= */

        .academic-icon {
            position: absolute;

            z-index: 1;

            opacity: 0.55;

            font-size: 76px;

            filter: grayscale(20%);
        }


        .cap-1 {
            top: 54px;
            left: 25px;

            transform: rotate(-15deg);
        }


        .cap-2 {
            bottom: 65px;
            left: 310px;

            transform: rotate(2deg);
        }


        .cap-3 {
            bottom: 280px;
            right: -15px;

            transform: rotate(5deg);
        }


        .trophy {
            bottom: 330px;
            right: 325px;

            font-size: 67px;

            transform: rotate(-8deg);
        }


        /* =========================
           LITTLE DECORATIVE DOTS
        ========================= */

        .dot {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #f5c400;

            z-index: 2;
        }


        .dot.d1 {
            top: 280px;
            left: 220px;
        }


        .dot.d2 {
            top: 505px;
            left: 290px;
        }


        .dot.d3 {
            top: 505px;
            right: 300px;
        }


        .dot.d4 {
            bottom: 210px;
            right: 125px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {

            .nav-links {
                gap: 100px;
                margin-left: 0;
            }

            .hero-title {
                font-size: 43px;
                white-space: normal;
            }

            .hero-description {
                font-size: 28px;
            }
        }


        @media (max-width: 750px) {

            .navbar {
                height: auto;
                min-height: 76px;

                padding: 15px 20px;
            }

            .logo {
                font-size: 30px;
            }

            .nav-links {
                display: none;
            }

            .login-button {
                width: 130px;
                height: 40px;

                font-size: 21px;
            }

            .hero {
                padding-top: 100px;
            }

            .hero-title {
                font-size: 34px;
            }

            .hero-description {
                font-size: 23px;
                margin-bottom: 80px;
            }

            .start-button {
                width: 85%;
                height: 110px;

                font-size: 30px;
            }

            .academic-icon {
                display: none;
            }

            .target {
                transform: scale(0.7);
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            StudentLy.
        </div>


        <div class="nav-links">

            <a href="#">
                How it works
            </a>

            <a href="#">
                About
            </a>

        </div>


        <a href="{% url 'login' %}" class="login-button">Login</a>

    </nav>



    <!-- =========================
         HERO SECTION
    ========================== -->

    <main class="hero">


        <!-- Decorative stars -->

        <div class="star s1">☆</div>
        <div class="star s2">☆</div>
        <div class="star s3">☆</div>
        <div class="star small s4">☆</div>
        <div class="star s5">☆</div>
        <div class="star small s6">☆</div>
        <div class="star s7">☆</div>
        <div class="star small s8">☆</div>


        <!-- Targets -->

        <div class="target t1"></div>
        <div class="target t2"></div>
        <div class="target t3"></div>
        <div class="target t4"></div>


        <!-- Academic decorations -->

        <div class="academic-icon cap-1">
            🎓
        </div>

        <div class="academic-icon cap-2">
            🎓
        </div>

        <div class="academic-icon cap-3">
            🎓
        </div>

        <div class="academic-icon trophy">
            🏆
        </div>


        <!-- Small dots -->

        <div class="dot d1"></div>
        <div class="dot d2"></div>
        <div class="dot d3"></div>
        <div class="dot d4"></div>


        <!-- Main content -->

        <div class="hero-content">

            <h1 class="hero-title">
                Understand Your Academic Journey
            </h1>


            <p class="hero-description">
                Your personal space to understand your<br>
                progress, set goals, and build better study habits
            </p>


            <!-- Django-connected button -->
            <a href="{% url 'create_profile' %}" class="start-button">
                Get Started →
            </a>

        </div>

    </main>


</body>
</html>
