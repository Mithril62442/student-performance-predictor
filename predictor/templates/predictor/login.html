<!DOCTYPE html>
<html lang="en">

{% load static %}

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | StudentLy.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #28104d;
            font-family: "Roboto Mono", monospace;
            overflow-x: hidden;
        }

        /* =====================================
           TOP NAVBAR
        ===================================== */

        .navbar {
            height: 76px;
            width: 100%;
            background: #570b53;
            display: flex;
            align-items: center;
            padding-left: 39px;
            position: relative;
            z-index: 10;
        }

        .logo {
            color: #b9d9df;
            font-family: Arial, sans-serif;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -1.5px;
        }

        /* =====================================
           MAIN LOGIN AREA
        ===================================== */

        .page {
            width: 100%;
            min-height: calc(100vh - 76px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .login-panel {
            width: 1059px;
            min-height: calc(100vh - 76px);
            background: #e1d0e9;
            position: relative;
            padding-top: 120px;
            padding-bottom: 70px;
        }

        /* =====================================
           WELCOME SECTION
        ===================================== */

        .welcome-section {
            text-align: center;
            position: relative;
            width: 100%;
        }

        .welcome-title {
            font-size: 44px;
            font-weight: 700;
            color: #050505;
            line-height: 1;
            margin: 0;
            display: inline-block;
        }

        .mascot {
            width: 110px;
            height: 110px;
            object-fit: contain;
            vertical-align: middle;
            margin-left: 18px;
            margin-top: -10px;
        }

        .subtitle {
            margin-top: 36px;
            font-size: 27px;
            font-weight: 400;
            color: #080808;
            line-height: 1.3;
        }

        /* =====================================
           LOGIN FORM
        ===================================== */

        .login-form {
            width: 560px;
            margin: 86px auto 0;
        }

        .form-group {
            margin-bottom: 57px;
        }

        .field-label {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 15px;
            color: #30205e;
            font-size: 29px;
            font-weight: 700;
        }

        .star {
            color: #b0b72b;
            font-size: 29px;
            line-height: 1;
            font-family: Arial, sans-serif;
        }

        .input-box {
            width: 100%;
            height: 49px;
            border: none;
            outline: none;
            border-radius: 19px;
            background: #fff6f7;
            padding: 0 25px;
            font-family: "Roboto Mono", monospace;
            font-size: 17px;
            font-weight: 600;
            color: #171717;

            box-shadow:
                0 19px 27px rgba(91, 69, 101, 0.20);

            transition:
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .input-box::placeholder {
            color: #171717;
            opacity: 1;
        }

        .input-box:focus {
            box-shadow:
                0 19px 27px rgba(91, 69, 101, 0.20),
                0 0 0 2px rgba(48, 32, 94, 0.25);
        }

        /* =====================================
           FORGOT PASSWORD
        ===================================== */

        .forgot-password {
            text-align: right;
            margin-top: -35px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #30205e;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        /* =====================================
           LOGIN BUTTON
        ===================================== */

        .login-button {
            display: block;
            width: 143px;
            height: 44px;
            margin: 26px auto 0;
            border: none;
            border-radius: 9px;
            background: #49262c;
            color: #ffffff;
            font-family: "Roboto Mono", monospace;
            font-size: 21px;
            font-weight: 700;
            cursor: pointer;

            box-shadow:
                5px 7px 9px rgba(0, 0, 0, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                6px 9px 11px rgba(0, 0, 0, 0.27);
        }

        .login-button:active {
            transform: translateY(1px);

            box-shadow:
                2px 3px 5px rgba(0, 0, 0, 0.22);
        }

        /* =====================================
           ERROR MESSAGE
        ===================================== */

        .error-message {
            color: #9b1c1c;
            text-align: center;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: 600;
        }

        /* =====================================
           SIGN UP
        ===================================== */

        .signup-text {
            margin-top: 37px;
            text-align: center;
            color: #050505;
            font-size: 29px;
            font-weight: 400;
        }

        .signup-link {
            color: #050505;
            text-decoration: none;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 1100px) {

            .login-panel {
                width: 100%;
                max-width: 1059px;
            }
        }

        @media (max-width: 700px) {

            .navbar {
                height: 70px;
                padding-left: 25px;
            }

            .logo {
                font-size: 31px;
            }

            .login-panel {
                min-height: calc(100vh - 70px);
                padding: 80px 25px 60px;
            }

            .welcome-title {
                font-size: 34px;
            }

            .mascot {
                width: 80px;
                height: 80px;
                margin-left: 8px;
            }

            .subtitle {
                font-size: 20px;
                margin-top: 30px;
            }

            .login-form {
                width: 100%;
                max-width: 560px;
                margin-top: 65px;
            }

            .field-label {
                font-size: 23px;
            }

            .input-box {
                height: 49px;
            }

            .signup-text {
                font-size: 21px;
            }
        }

        @media (max-width: 450px) {

            .welcome-title {
                display: block;
                font-size: 30px;
            }

            .mascot {
                display: block;
                margin: 15px auto 0;
            }

            .subtitle {
                font-size: 18px;
            }

            .field-label {
                font-size: 21px;
            }
        }

    </style>
</head>


<body>

    <!-- =====================================
         TOP NAVBAR
    ====================================== -->

    <nav class="navbar">

        <div class="logo">
            StudentLy.
        </div>

    </nav>


    <!-- =====================================
         LOGIN PAGE
    ====================================== -->

    <main class="page">

        <section class="login-panel">

            <!-- Welcome -->

            <div class="welcome-section">

                <div>

                    <h1 class="welcome-title">
                        Welcome Back
                    </h1>

                    <img
                        src="{% static 'images/mascot.png' %}"
                        alt=""
                        class="mascot"
                    >

                </div>


                <p class="subtitle">
                    Log in to continue your journey
                </p>

            </div>


            <!-- Login Form -->

            <form
                class="login-form"
                method="POST"
                action="{% url 'login' %}"
            >

                {% csrf_token %}


                <!-- Error Messages -->

                {% if messages %}

                    {% for message in messages %}

                        <p class="error-message">
                            {{ message }}
                        </p>

                    {% endfor %}

                {% endif %}


                <!-- Username -->

                <div class="form-group">

                    <label
                        for="username"
                        class="field-label"
                    >

                        <span class="star">
                            ★
                        </span>

                        <span>
                            Username
                        </span>

                    </label>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="input-box"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label
                        for="password"
                        class="field-label"
                    >

                        <span class="star">
                            ★
                        </span>

                        <span>
                            Password
                        </span>

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-box"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Forgot Password -->

                <div class="forgot-password">

                    <a href="{% url 'password_reset' %}">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- Sign Up -->

            <p class="signup-text">

                New here?

                <a
                    href="#"
                    class="signup-link"
                >
                    Sign up
                </a>

            </p>


        </section>

    </main>

</body>
</html>
