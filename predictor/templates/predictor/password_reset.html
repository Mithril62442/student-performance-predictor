<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | StudentLy.</title>
</head>

<body>

    <h1>Forgot Password?</h1>

    <p>
        Enter your email address and we'll send you instructions
        to reset your password.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Reset Link
        </button>
    </form>

</body>
</html>
