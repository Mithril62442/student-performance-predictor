<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | StudentLy.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            min-height: 100vh;
            background: #28104d;
            font-family: "Roboto Mono", monospace;
            overflow-x: hidden;
        }


        /* ==============================
           NAVBAR
        ============================== */

        .navbar {
            width: 100%;
            height: 69px;
            background: #570b53;

            display: flex;
            align-items: center;

            padding: 0 38px;
        }


        .logo {
            color: #b9d9df;

            font-family: Arial, sans-serif;
            font-size: 39px;
            font-weight: 700;

            letter-spacing: -1.5px;
        }


        .nav-links {
            display: flex;
            align-items: center;

            gap: 235px;

            margin-left: auto;
            margin-right: 77px;
        }


        .nav-links a {
            text-decoration: none;

            color: white;

            font-family: Arial, sans-serif;
            font-size: 29px;
            font-weight: 700;
        }


        .login-button {
            width: 193px;
            height: 40px;

            border-radius: 25px;

            background: #b4d8e4;
            color: #24151c;

            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: 26px;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* ==============================
           PAGE
        ============================== */

        .page {
            width: 100%;
            min-height: calc(100vh - 69px);

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        .signup-panel {
            width: 963px;
            min-height: calc(100vh - 69px);

            background: #e1d0e9;

            padding-top: 60px;
            padding-bottom: 60px;
        }


        /* ==============================
           STEP
        ============================== */

        .step {
            text-align: center;

            color: #111111;

            font-size: 18px;
            font-weight: 400;

            margin-bottom: 43px;
        }


        /* ==============================
           TITLE
        ============================== */

        .page-title {
            text-align: center;

            color: #050505;

            font-size: 45px;
            line-height: 1;

            font-weight: 700;

            margin-bottom: 76px;
        }


        /* ==============================
           FORM
        ============================== */

        .signup-form {
            width: 528px;

            margin: 0 auto;
        }


        .form-group {
            margin-bottom: 48px;
        }


        /* ==============================
           LABEL
        ============================== */

        .field-label {
            display: flex;
            align-items: center;

            gap: 12px;

            margin-bottom: 14px;

            color: #30205e;

            font-size: 29px;
            line-height: 1;

            font-weight: 700;
        }


        .star {
            color: #b0b72b;

            font-family: Arial, sans-serif;
            font-size: 28px;

            line-height: 1;
        }


        /* ==============================
           INPUT
        ============================== */

        .input-box {
            width: 100%;
            height: 49px;

            border: none;
            outline: none;

            border-radius: 19px;

            background: #fff6f7;

            padding: 0 25px;

            font-family: "Roboto Mono", monospace;

            font-size: 17px;
            font-weight: 600;

            color: #171717;

            box-shadow:
                0 19px 27px rgba(91, 69, 101, 0.20);
        }


        .input-box::placeholder {
            color: #171717;
            opacity: 1;
        }


        .input-box:focus {
            box-shadow:
                0 19px 27px rgba(91, 69, 101, 0.20),
                0 0 0 2px rgba(48, 32, 94, 0.25);
        }


        /* ==============================
           PASSWORD CHECKLIST
        ============================== */

        .password-checklist {
            margin-top: 12px;
            padding-left: 5px;

            font-family: "Roboto Mono", monospace;
            font-size: 13px;
            line-height: 1.7;
        }


        .password-checklist div {
            color: #77707c;
        }


        /* ==============================
           PASSWORD MATCH
        ============================== */

        #password-match {
            margin-top: 8px;
            padding-left: 5px;

            font-family: "Roboto Mono", monospace;
            font-size: 13px;
            font-weight: 600;
        }


        /* ==============================
           ERROR MESSAGES
        ============================== */

        .django-messages {
            width: 528px;
            margin: -50px auto 35px;
        }


        .error-message {
            color: #a51d2d;

            font-size: 14px;
            font-weight: 600;

            padding: 10px 14px;

            border-radius: 10px;

            background: rgba(165, 29, 45, 0.08);

            margin-bottom: 8px;
        }


        /* ==============================
           BOTTOM BUTTONS
        ============================== */

        .button-row {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 30px;

            margin-top: 104px;
        }


        .back-button,
        .finish-button {

            height: 44px;

            border: none;

            border-radius: 9px;

            font-family: "Roboto Mono", monospace;

            font-size: 20px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                5px 7px 9px rgba(0, 0, 0, 0.22);

            transition: 0.2s ease;
        }


        .back-button {

            width: 135px;

            background: #49262c;
            color: white;

            text-decoration: none;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .finish-button {

            width: 125px;

            background: #49262c;
            color: white;
        }


        .back-button:hover,
        .finish-button:hover {

            transform: translateY(-2px);

            box-shadow:
                6px 9px 11px rgba(0, 0, 0, 0.27);
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 1100px) {

            .signup-panel {
                width: 100%;
                max-width: 963px;
            }

            .nav-links {
                gap: 100px;
                margin-right: 30px;
            }
        }


        @media (max-width: 750px) {

            .navbar {
                height: 70px;
                padding: 0 20px;
            }


            .logo {
                font-size: 31px;
            }


            .nav-links {
                display: none;
            }


            .login-button {
                width: 130px;
                height: 40px;

                font-size: 21px;
            }


            .signup-panel {
                min-height: calc(100vh - 70px);

                padding:
                    50px 25px
                    60px;
            }


            .step {
                font-size: 16px;
            }


            .page-title {
                font-size: 36px;

                margin-bottom: 60px;
            }


            .signup-form {
                width: 100%;
                max-width: 528px;
            }


            .field-label {
                font-size: 22px;
            }


            .input-box {
                height: 49px;
            }


            .django-messages {
                width: 100%;
                max-width: 528px;
            }


            .button-row {
                margin-top: 70px;
            }
        }


        @media (max-width: 450px) {

            .page-title {
                font-size: 30px;
            }


            .field-label {
                font-size: 20px;
            }


            .input-box {
                font-size: 15px;
            }


            .button-row {
                gap: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- ==============================
         NAVBAR
    ============================== -->

    <nav class="navbar">

        <div class="logo">
            StudentLy.
        </div>


        <div class="nav-links">

            <a href="#">
                How it works
            </a>

            <a href="#">
                About
            </a>

        </div>


        <a href="{% url 'login' %}" class="login-button">
            Login
        </a>

    </nav>



    <!-- ==============================
         MAIN CONTENT
    ============================== -->

    <main class="page">

        <section class="signup-panel">


            <div class="step">
                Step 2 of 2 · Authentication
            </div>


            <h1 class="page-title">
                Create Account
            </h1>


            <!-- DJANGO ERROR MESSAGES -->

            {% if messages %}

                <div class="django-messages">

                    {% for message in messages %}

                        <div class="error-message">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <form
                method="POST"
                class="signup-form"
                id="signup-form"
            >

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="form-group">

                    <label
                        for="username"
                        class="field-label"
                    >

                        <span class="star">
                            ★
                        </span>

                        <span>
                            Choose Username
                        </span>

                    </label>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="input-box"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label
                        for="password"
                        class="field-label"
                    >

                        <span class="star">
                            ★
                        </span>

                        <span>
                            Create Password
                        </span>

                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-box"
                        placeholder="Enter the Password"
                        autocomplete="new-password"
                        required
                    >


                    <!-- LIVE PASSWORD CHECKLIST -->

                    <div class="password-checklist">

                        <div id="length-check">
                            ○ At least 8 characters
                        </div>

                        <div id="uppercase-check">
                            ○ One uppercase letter
                        </div>

                        <div id="lowercase-check">
                            ○ One lowercase letter
                        </div>

                        <div id="number-check">
                            ○ One number
                        </div>

                        <div id="special-check">
                            ○ One special character
                        </div>

                    </div>

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label
                        for="confirm_password"
                        class="field-label"
                    >

                        <span class="star">
                            ★
                        </span>

                        <span>
                            Confirm your Password
                        </span>

                    </label>


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="input-box"
                        placeholder="Re-enter password"
                        autocomplete="new-password"
                        required
                    >


                    <div id="password-match"></div>

                </div>



                <!-- BUTTONS -->

                <div class="button-row">

                    <a
                        href="{% url 'create_profile' %}"
                        class="back-button"
                    >
                        ← Back
                    </a>


                    <button
                        type="submit"
                        class="finish-button"
                    >
                        Finish
                    </button>

                </div>


            </form>

        </section>

    </main>


    <!-- ==============================
         PASSWORD CHECKING
    ============================== -->

    <script>

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirm_password");


        const lengthCheck =
            document.getElementById("length-check");

        const uppercaseCheck =
            document.getElementById("uppercase-check");

        const lowercaseCheck =
            document.getElementById("lowercase-check");

        const numberCheck =
            document.getElementById("number-check");

        const specialCheck =
            document.getElementById("special-check");


        const passwordMatch =
            document.getElementById("password-match");


        function updateCheck(
            element,
            condition,
            text
        ) {

            if (condition) {

                element.textContent =
                    "✓ " + text;

                element.style.color =
                    "#2e7d32";

            } else {

                element.textContent =
                    "○ " + text;

                element.style.color =
                    "#77707c";

            }

        }


        function checkPassword() {

            const value =
                password.value;


            updateCheck(
                lengthCheck,
                value.length >= 8,
                "At least 8 characters"
            );


            updateCheck(
                uppercaseCheck,
                /[A-Z]/.test(value),
                "One uppercase letter"
            );


            updateCheck(
                lowercaseCheck,
                /[a-z]/.test(value),
                "One lowercase letter"
            );


            updateCheck(
                numberCheck,
                /[0-9]/.test(value),
                "One number"
            );


            updateCheck(
                specialCheck,
                /[^A-Za-z0-9]/.test(value),
                "One special character"
            );


            checkPasswordMatch();

        }


        function checkPasswordMatch() {

            if (confirmPassword.value === "") {

                passwordMatch.textContent = "";

                return;

            }


            if (
                password.value ===
                confirmPassword.value
            ) {

                passwordMatch.textContent =
                    "✓ Passwords match";

                passwordMatch.style.color =
                    "#2e7d32";

            } else {

                passwordMatch.textContent =
                    "✗ Passwords do not match";

                passwordMatch.style.color =
                    "#a51d2d";

            }

        }


        password.addEventListener(
            "input",
            checkPassword
        );


        confirmPassword.addEventListener(
            "input",
            checkPasswordMatch
        );


        /* Prevent submission if passwords don't match */

        document
            .getElementById("signup-form")
            .addEventListener(
                "submit",
                function(event) {

                    const value =
                        password.value;

                    const validPassword =
                        value.length >= 8 &&
                        /[A-Z]/.test(value) &&
                        /[a-z]/.test(value) &&
                        /[0-9]/.test(value) &&
                        /[^A-Za-z0-9]/.test(value);


                    if (!validPassword) {

                        event.preventDefault();

                        passwordMatch.textContent =
                            "✗ Please meet all password requirements.";

                        passwordMatch.style.color =
                            "#a51d2d";

                        return;

                    }


                    if (
                        password.value !==
                        confirmPassword.value
                    ) {

                        event.preventDefault();

                        passwordMatch.textContent =
                            "✗ Passwords do not match.";

                        passwordMatch.style.color =
                            "#a51d2d";

                    }

                }
            );

    </script>


</body>

</html>
