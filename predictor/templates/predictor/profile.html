<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Your Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #d686ec;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            color: #d00;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Create Your Profile 👋</h1>

    <p class="subtitle">
        Tell us a little about yourself so we can personalise your experience.
    </p>

    <form method="POST">

        {% csrf_token %}

        {% for field in form %}
            <div class="field">

                {{ field.label_tag }}

                {{ field }}

                {% for error in field.errors %}
                    <div class="error">{{ error }}</div>
                {% endfor %}

            </div>
        {% endfor %}

        <button type="submit">
            Continue →
        </button>

    </form>

</div>

</body>
</html>
